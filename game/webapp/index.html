<!-- vim: set filetype=javascript: -->
<!DOCTYPE html>
<html>
  <head>
    <title>Dartboard</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no">

    <link rel="stylesheet" type="text/css" href="dartboard.css">
    <link rel="icon" type="image/svg" href="dart.svg">

    <script type="application/javascript" src="Panel.js"></script>
    <script type="application/javascript" src="Screen.js"></script>
    <script type="application/javascript" src="DartsPanel.js"></script>
    <script type="application/javascript" src="Sector.js"></script>
    <script type="application/javascript" src="GamePanel.js"></script>
  </head>

  <body onload='startGame ("canvas", "error");'>
    <canvas id="canvas">
      <p>Désolé, votre navigateur ne supporte pas Canvas. Mettez-vous à jour</p>
    </canvas>

    <div id="wifi-modal" style="display: none;">
      <div class="modal-content">
        <h3>Réseau Dartboard</h3>

        <label for="wifi-ssid">SSID (Nom du réseau)</label>
        <input type="text" id="wifi-ssid" placeholder="Ex: Livebox-XXXX" spellcheck="false">

        <label for="wifi-password">Code Wi-Fi</label>
        <input type="password" id="wifi-password" placeholder="••••••••">

        <div class="modal-buttons">
          <button onclick="validateWifi()" class="css-button">
            <span class="css-button-text" style="padding: 8px 15px;">Valider</span>
          </button>
          <button onclick="cancelWifi()" class="cancel-btn">Annuler</button>
        </div>
      </div>
    </div>

    <div class="row">
      <button type="button" id="wifi-button" class="css-button" onclick="wifi()">
        <span class="css-button-text">
          <span>⚙️ Wi-Fi</span>
        </span>
      </button>

      <div style="padding-left: 40px;">
        <button type="button" class="css-button" onclick="reset()">
          <span class="css-button-icon"></span>
          <span class="css-button-text">
            <span>Reset</span>
          </span>
        </button>
      </div>

      <div style="padding-left: 20px;">
        <button type="button" class="css-button" onclick="addPlayer()">
          <span class="css-button-icon"></span>
          <span class="css-button-text">
            <span>P+</span>
          </span>
        </button>
      </div>

      <div style="padding-left: 20px;">
        <button type="button" class="css-button" onclick="removePlayer()">
          <span class="css-button-icon"></span>
          <span class="css-button-text">
            <span>P-</span>
          </span>
        </button>
      </div>
    </div>

    <img id='error'/>
  </body>
</html>
